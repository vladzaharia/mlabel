name: Docs

# No untrusted event data is interpolated anywhere in this workflow: every
# `run:` is a static command, so there is no injection surface.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schema/**"
      - "src/core/config/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight — a half-applied
# Pages deploy would leave the live site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # `docs/` is a standalone package with its own lockfile, deliberately not
      # a workspace member — see docs/pnpm-workspace.yaml. The app's own
      # dependencies are never installed here.
      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # Regenerates the schema reference, copies the JSON Schema into public/,
      # emits llms.txt, and fails on a broken internal link.
      - name: Build
        run: pnpm build
        working-directory: docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - id: deploy
        uses: actions/deploy-pages@v4
