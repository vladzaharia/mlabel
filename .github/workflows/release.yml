name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (for example v0.4.0)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Gate: same checks as CI, fanned out. Runs in parallel with `build`.
  verify:
    name: verify (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: lint, run: pnpm lint }
          - { name: format, run: pnpm format:check }
          - { name: typecheck, run: pnpm typecheck }
          - { name: test, run: pnpm test }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/setup
      - name: Run ${{ matrix.check.name }}
        env:
          CHECK_CMD: ${{ matrix.check.run }}
        run: $CHECK_CMD

  # Build the platform-agnostic bundle ONCE; both packaging jobs reuse it.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 1

  # Pre-create the release as a draft so the two packaging runners upload into a
  # single, already-existing release (no create-race), then `publish` un-drafts it.
  draft:
    name: draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace an already published release."
              exit 1
            }
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi

  # Package per-OS from the prebuilt out/ (no electron-vite rebuild). electron-builder
  # signs/notarizes on macOS and uploads installers + latest*.yml to the draft.
  package:
    name: package (${{ matrix.platform }})
    needs: [verify, build, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out/
      - name: Derive version from tag
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Write Apple API key (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
      # electron-builder 26.15.6 confuses the certificate password with the
      # temporary keychain password. Import explicitly and use CSC_KEYCHAIN.
      # https://github.com/electron-userland/electron-builder/pull/10172
      - name: Import macOS signing certificate
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/mlabel-signing.p12"
          keychain_path="$RUNNER_TEMP/mlabel-signing.keychain-db"
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$signing_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$signing_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$signing_password" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Package & publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          # Certificate import is handled above; never set CSC_LINK here or
          # electron-builder will create another temporary keychain.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$PLATFORM" = mac ]; then
            pnpm package:mac --config.extraMetadata.version="$VERSION" --config.forceCodeSigning=true
          else
            pnpm package:win --config.extraMetadata.version="$VERSION"
          fi
      - name: Remove macOS signing material
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mlabel-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/mlabel-signing.p12" "$HOME/private_keys/AuthKey.p8"

  # All artifacts uploaded — flip the draft live (published immediately).
  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit "$TAG" --draft=false
