appId: gg.vlad.mlabel
productName: MLabel
copyright: Copyright © 2026 vlad

directories:
  output: release
  buildResources: build

# electron-vite emits the app into out/. Keep dependencies external (not bundled).
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip # required alongside dmg for a notarizable artifact
      arch: [universal]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization via notarytool. In electron-builder 26 this is a boolean; all
  # credentials are read from the environment (loaded from .env by `build:mac`):
  #   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (App Store Connect key)
  #   APPLE_TEAM_ID (team)
  # Signing uses the "Developer ID Application" identity from the Keychain.
  notarize: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows ships unsigned for v1 (users click through SmartScreen). Add
# win.signtoolOptions / Azure Trusted Signing later without other changes.
win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
