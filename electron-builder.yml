appId: gg.vlad.mlabel
productName: MLabel
copyright: Copyright © 2026 Vlad Zaharia

directories:
  output: release
  buildResources: build

# Auto-update host. electron-updater generates and uploads the latest*.yml
# metadata alongside the installers when publishing.
publish:
  provider: github
  owner: vladzaharia
  repo: mlabel
  releaseType: release

# electron-vite emits the app into out/. Keep dependencies external (not bundled).
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - "**/*.node"

mac:
  # Portable distribution: a bare, notarizable .app inside a zip (no dmg installer).
  target:
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png # generates the bundled .icns (matches the runtime icon)
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization via notarytool. In electron-builder 26 this is a boolean; all
  # credentials are read from the environment (loaded from .env by `build:mac`):
  #   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (App Store Connect key)
  #   APPLE_TEAM_ID (team)
  # Signing uses the "Developer ID Application" identity from the Keychain.
  notarize: true

# Windows ships unsigned for v1 (users click through SmartScreen). Add
# win.signtoolOptions / Azure Trusted Signing later without other changes.
win:
  # Ship both: NSIS (installer, auto-updatable) and portable (single self-contained
  # .exe; can't self-install, so the app links portable users to the release asset).
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
  icon: build/icon.png # generates the bundled .ico (matches the runtime icon)

# Deterministic portable filename so the app can deep-link to the exact asset.
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
